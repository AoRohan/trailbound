// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Declared here, not in variables.gradle: that file is applied *after* this
    // block, so anything referenced by a classpath must be defined inline.
    ext.kotlinVersion = '2.1.0'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Health Connect's client API is Kotlin coroutines only, so the step
        // plugin has to be Kotlin.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
