name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# The whole reason this runs here rather than locally: an Android build wants
# 2-3 GB of RAM for Gradle and Kotlin, which the dev laptop does not have to
# spare. GitHub's runner has 16 GB and the Android SDK preinstalled, and it
# costs nothing.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8's own android module compiles at source release 21, so
          # anything lower fails with "invalid source release: 21".
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Build the web app
        # No VITE_BASE here: inside the APK the app is served from the root of
        # its own bundle, not from a /repo/ subpath like Pages.
        run: npm run build

      - name: Copy the web build into the Android project
        run: npx cap sync android

      # Sign with a stable key so updates install over the previous version.
      # Without it Gradle falls back to a debug keystore that AGP regenerates
      # on every fresh runner, and Android rejects the update outright.
      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::warning::No signing keystore secret; falling back to an ephemeral debug key. Updates will not install over an existing app."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/trailbound-signing.p12
          echo "keystore restored ($(stat -c%s android/trailbound-signing.p12) bytes)"

      - name: Assemble debug APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report the signing certificate
        # Printed on every build so a key change is visible in the log rather
        # than showing up as "App not installed" on the phone.
        run: |
          python3 tools/apk_info.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Confirm no location permission shipped
        # A regression here would be the one thing the user explicitly asked
        # never to happen, so it fails the build rather than a code review.
        run: |
          MANIFEST=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*debug*' | head -1)
          echo "Checking $MANIFEST"
          if grep -qi 'permission.ACCESS_[A-Z_]*LOCATION' "$MANIFEST"; then
            echo "::error::A location permission was found in the merged manifest"
            grep -i 'permission.ACCESS_[A-Z_]*LOCATION' "$MANIFEST"
            exit 1
          fi
          echo "No location permission present."

      - uses: actions/upload-artifact@v4
        with:
          name: trailbound-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Artifacts need a GitHub login to download, which is painful on a phone.
      # A rolling release gives a stable, login-free URL instead:
      #   github.com/AoRohan/trailbound/releases/latest/download/app-debug.apk
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build" \
            --latest \
            --notes "Debug APK built from \`${GITHUB_SHA:0:7}\`.

          Install: download on the phone and tap it. Android will ask you to
          allow installing from unknown sources the first time.

          Declares no location permission."
